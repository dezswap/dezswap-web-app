name: Prod Trigger

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Production Deployment Approval"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  on-failure:
    if: github.event.inputs.deploy == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The triggering workflow failed'

  deploy:
    if: github.event.inputs.deploy == 'true'
    name: Build, Deploy to GCS bucket
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout Repository 📝
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/install

      - name: Build
        env:
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload hashed assets
        run: |
          gcloud storage rsync dist/assets gs://${{ secrets.GCP_BUCKET_NAME }}/assets \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="public, max-age=31536000, immutable"

      - name: Upload non-hashed assets
        run: |
          gcloud storage rsync dist gs://${{ secrets.GCP_BUCKET_NAME }} \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="no-cache, must-revalidate" \
            --exclude="^assets/.*$"

      - name: Invalidate Cloud CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ secrets.GCP_CDN_URL_MAP }} \
            --path "/*" \
            --global
